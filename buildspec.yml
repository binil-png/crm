version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - aws s3 sync dist/ s3://pappyjoe-crm/dist --delete
      - aws cloudfront create-invalidation --distribution-id E3HO3V7IWEV263 --paths "/*"