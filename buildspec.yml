version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Starting the install phase... env::${environment} build number ${CODEBUILD_BUILD_NUMBER}"
      - aws --version
      - |
        if [ "${environment}" = "prod" ]; then
          aws configure set preview.cloudfront true
        fi

  pre_build:
    commands:
      - echo "Starting the pre-build phase..."
      - export VITE_BUILD_VERSION=$(date +"%d%m%Y-%H-%M-%S.$CODEBUILD_BUILD_NUMBER")
      - npm install
      - aws s3 cp s3://${target_bucket}/${environment}/ . --recursive
      - echo "Pre-build phase completed."
  build:
    commands:
      - echo "Starting the build phase..."
      - export NODE_OPTIONS="--max-old-space-size=8192"
      - npm run build
      - echo "build phase completed."
      - echo "Starting the post-build phase..."
      - cd dist
      - ls -ltrh
      - aws s3 sync . s3://${target_bucket} --exclude "*.html" --exclude "workbook-config.json" --cache-control "max-age=31536000, public"
      - aws s3 cp index.html s3://${target_bucket}/index.html --cache-control "no-cache, no-store, must-revalidate"
      - |
        if [ -f workbook-config.json ]; then
          aws s3 cp workbook-config.json s3://${target_bucket}/workbook-config.json --content-type application/json --cache-control "no-cache, no-store, must-revalidate"
        fi
      - |
        if [ -n "${lambda_function_name}" ]; then
          cd ..
          zip -r sheets-api.zip server api/lambda.js
          if [ -d secrets ]; then zip -r sheets-api.zip secrets; fi
          aws lambda update-function-code --function-name "${lambda_function_name}" --zip-file fileb://sheets-api.zip
          cd dist
        fi
      - aws configure set preview.cloudfront true
      - aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/*" || echo "Failed to invalidate $distribution_id";
      - echo "Post-build phase completed."
